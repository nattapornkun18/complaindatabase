const HOTELS = [
  {id:"all",label:"ทุกโรงแรม"},
  {id:"amber-p",label:"Amber Pattaya"},
  {id:"amber-s",label:"Amber Sukhumvit"},
  {id:"arbour",label:"Arbour"},
  {id:"grass",label:"The Grass"},
  {id:"arden",label:"Arden"},
  {id:"altera",label:"Altera"},
  {id:"aster",label:"Aster"},
];

const SEV_FILTERS = [
  {id:"all",label:"ทั้งหมด"},
  {id:"h",label:"ร้ายแรง"},
  {id:"m",label:"ปานกลาง"},
  {id:"l",label:"ทั่วไป"},
];

let currentHotel = "all";
let currentSev = "all";

function sevLabel(s){return s==="h"?"ร้ายแรง":s==="m"?"ปานกลาง":"ทั่วไป"}
function sevClass(s){return s==="h"?"sev-h":s==="m"?"sev-m":"sev-l"}

function buildKpi(){
  const d = DATA[currentHotel];
  const kpiDefs = currentHotel === "all"
    ? [{label:"รีวิวทั้งหมด",value:d.total,sub:"8 โรงแรม"},{label:"มีข้อความ",value:d.reviews_with_text,sub:"รีวิวที่ระบุปัญหา"},{label:"Negative",value:d.negative_pct+"%",sub:"จัดประเภทเชิงลบ"},{label:"แหล่งที่มา",value:"6",sub:"Booking/Agoda/Google..."}]
    : [{label:"รีวิวทั้งหมด",value:d.total,sub:"โรงแรมนี้"},{label:"มีข้อความ",value:d.reviews_with_text,sub:"รีวิวที่ระบุปัญหา"},{label:"Negative",value:d.negative_pct+"%",sub:"จัดประเภทเชิงลบ"},{label:"หมวดปัญหา",value:d.cats.length,sub:"ประเภทที่พบ"}];
  document.getElementById("kpi-row").innerHTML = kpiDefs.map(k=>`<div class="kpi"><div class="kpi-label">${k.label}</div><div class="kpi-value">${k.value}</div><div class="kpi-sub">${k.sub}</div></div>`).join("");
}

function buildTabs(){
  document.getElementById("hotel-tabs").innerHTML = HOTELS.map(h=>`<div class="htab${h.id===currentHotel?" on":""}" onclick="switchHotel('${h.id}')">${h.label}</div>`).join("");
}

function buildFilters(){
  document.getElementById("filter-row").innerHTML = SEV_FILTERS.map(f=>`<div class="fchip${f.id===currentSev?" on":""}" onclick="switchSev('${f.id}')">${f.label}</div>`).join("");
}

function buildBars(){
  const d = DATA[currentHotel];
  const cats = currentSev==="all" ? d.cats : d.cats.filter(c=>c.sev===currentSev);
  if(!cats.length){document.getElementById("bar-list").innerHTML=`<div class="empty-state">ไม่มีข้อมูลในหมวดนี้</div>`;return;}
  document.getElementById("bar-list").innerHTML = cats.map(c=>`
    <div class="bar-item">
      <div class="bar-top">
        <span class="bar-name">${c.name}</span>
        <span class="bar-nums"><span class="sev-badge ${sevClass(c.sev)}">${sevLabel(c.sev)}</span>&nbsp;${c.n} รีวิว · ${c.pct}%</span>
      </div>
      <div class="track"><div class="fill fill-${c.color}" style="width:${c.pct}%"></div></div>
    </div>`).join("");
}

function buildAlerts(){
  const d = DATA[currentHotel];
  document.getElementById("alert-area").innerHTML = d.alerts.map(a=>`
    <div class="alert-box ${a.type==="amber"?"amber":""}">
      <div class="alert-title">${a.title}</div>
      <div class="alert-body">${a.body}</div>
    </div>`).join("");
}

function buildQuotes(){
  const d = DATA[currentHotel];
  const qs = currentSev==="all" ? d.quotes : d.quotes.filter(q=>q.sev===currentSev);
  if(!qs.length){document.getElementById("quote-list").innerHTML=`<div class="empty-state">ไม่มีรีวิวในหมวดนี้</div>`;return;}
  document.getElementById("quote-list").innerHTML = qs.map(q=>`
    <div class="q-card ${q.sev==="m"?"amber":""}">
      <div class="q-text">"${q.text}"</div>
      <div class="q-meta">
        <span class="q-hotel">${q.hotel}</span>
        <span class="sev-badge ${sevClass(q.sev)}">${sevLabel(q.sev)}</span>
      </div>
    </div>`).join("");
}

function render(){buildKpi();buildTabs();buildFilters();buildBars();buildAlerts();buildQuotes();}

function switchHotel(id){currentHotel=id;currentSev="all";render();}
function switchSev(id){currentSev=id;buildFilters();buildBars();buildQuotes();}

render();
</script>
